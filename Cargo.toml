[workspace]
resolver = "3"
members = [
    "crates/game-core",
    "crates/game-content",
    "crates/platform",
    "crates/game-client",
]
default-members = [
    "crates/game-core",
    "crates/game-content",
    "crates/platform",
]

[workspace.package]
version = "1.0.0"
edition = "2024"
# Bevy 0.19 exige rustc >= 1.95. Vérifié avec rustc 1.97.0.
rust-version = "1.95"
license = "MIT OR Apache-2.0"
authors = ["Contributeurs d'A la French"]

[workspace.dependencies]
game-core = { path = "crates/game-core" }
game-content = { path = "crates/game-content" }
platform = { path = "crates/platform" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ron = "0.12"
rand = { version = "0.9", default-features = false, features = ["std"] }
rand_chacha = { version = "0.9", default-features = false, features = ["std", "serde"] }

# Builds de debug plutôt rapides : nos crates légèrement optimisées, les dépendances complètement.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false

[profile.release]
codegen-units = 1
lto = "thin"

# Profil orienté taille pour le build navigateur (voir tools/build-web.sh).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
strip = "debuginfo"
