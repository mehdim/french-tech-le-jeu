name: Déployer sur GitHub Pages

# Compile la version navigateur et la publie sur
# https://<propriétaire>.github.io/<dépôt>/ à chaque push sur main.
# Réglage unique : Settings du dépôt → Pages → Source : « GitHub Actions ».

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: pages
      - name: Installer wasm-bindgen-cli (version de Cargo.lock)
        run: |
          V=$(grep -A1 'name = "wasm-bindgen"$' Cargo.lock | sed -n 's/version = "\(.*\)"/\1/p')
          cargo install wasm-bindgen-cli --version "$V" --locked
      - name: Installer wasm-opt (version native de binaryen)
        run: |
          curl -sSL https://github.com/WebAssembly/binaryen/releases/download/version_123/binaryen-version_123-x86_64-linux.tar.gz | tar xz
          echo "$PWD/binaryen-version_123/bin" >> "$GITHUB_PATH"
      - run: tools/build-web.sh
      # GitHub Pages ignore _headers ; il sert déjà les .wasm en
      # application/wasm. On désactive Jekyll pour servir chaque fichier tel quel.
      - run: rm -f dist/_headers && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
